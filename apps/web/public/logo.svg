<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="ConnectGSA">
  <title>ConnectGSA</title>
  <!--
    A marca do ConnectGSA: uma rede de nós formando um "C". Os pontos são os
    embaixadores; as linhas, as conexões entre eles.

    Este arquivo é o MESMO desenho de `src/components/Logo.tsx`, e existe porque
    há dois consumidores que não executam React: o ícone da aba do navegador e o
    README no GitHub. Mexeu num, mexa no outro.

    Fundo transparente de propósito — ele precisa funcionar sobre o claro e o
    escuro, e as cores escolhidas têm contraste nos dois.
  -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M50 12 L18 34" stroke="#4285F4"/>
    <path d="M18 34 L18 66" stroke="#4285F4"/>
    <path d="M18 66 L50 88" stroke="#4285F4"/>
    <path d="M50 88 L82 66" stroke="#34A853"/>
    <path d="M50 12 L82 34" stroke="#EA4335"/>
  </g>

  <!-- O "C" aberto à direita, formado por dois arcos. -->
  <path d="M66 30 A24 24 0 0 0 34 50" fill="none" stroke="#4285F4" stroke-width="9" stroke-linecap="round"/>
  <path d="M34 50 A24 24 0 0 0 66 70" fill="none" stroke="#34A853" stroke-width="9" stroke-linecap="round"/>

  <!-- Os nós: cada ponto é um embaixador. -->
  <circle cx="50" cy="12" r="8" fill="#EA4335"/>
  <circle cx="18" cy="34" r="8" fill="#4285F4"/>
  <circle cx="18" cy="66" r="8" fill="#4285F4"/>
  <circle cx="50" cy="88" r="8" fill="#34A853"/>
  <circle cx="82" cy="34" r="7" fill="#FBBC04"/>
  <circle cx="82" cy="66" r="8" fill="#34A853"/>
</svg>
