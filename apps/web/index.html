<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConnectGSA</title>
    <meta
      name="description"
      content="Rede dos participantes do Programa de Embaixadores Estudantis do Google."
    />
    <!-- Rede fechada: nada aqui deve ser indexado. -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      SVG e não .ico: um arquivo serve todas as densidades de tela e pesa menos
      de 1 KB, o que importa contra o teto de transferência do plano gratuito.
      O `.svg` é o mesmo desenho de `src/components/Logo.tsx`.
    -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!--
      O manifesto é o que torna a rede instalável na tela inicial.
      
      `apple-touch-icon` separado porque o Safari ignora os ícones do manifesto e
      procura esta tag — sem ela, o atalho no iPhone vira uma miniatura da
      página, que fica ilegível.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Acompanha o tema, para a barra do navegador não destoar da página. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)" />

    <!--
      A fonte vem do NOSSO domínio, não do CDN do Google.

      Google Sans está sob SIL Open Font License desde janeiro de 2026, então
      servi-la é permitido — e servi-la daqui é o que mantém a coerência com a
      escolha do OpenFreeMap para o mapa: numa rede de estudantes, não
      introduzir um terceiro que vê IP e User-Agent a cada visita pesa mais que
      a conveniência do CDN. De quebra somem dois `preconnect` do caminho
      crítico e duas origens da CSP.

      O custo é 175 KB versionados e ~36 KB por visita nova (só o subset latino
      da Google Sans carrega numa página em português) — contra o teto de
      360 MB/dia do Hosting, é ruído. Regerar: `node scripts/baixar-fontes.mjs`.

      O `preload` só do arquivo latino: ele é o que toda página usa. Pré-carregar
      os seis desperdiçaria a banda que este arquivo existe para poupar.
    -->
    <link
      rel="preload"
      href="/fonts/google-sans-400-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/fontes.css" />

    <!--
      Cloudflare Web Analytics.

      Escolhido em vez do Google Analytics por coerência com o resto do produto:
      esta rede tirou o Google Fonts do caminho e escolheu o OpenFreeMap para o
      mapa pela mesma razão — não entregar o IP de um estudante a um terceiro que
      ele não escolheu.

      O que este script NÃO faz: não grava cookie, não usa `localStorage`, não
      cria identificador de visitante e não segue ninguém entre sites. Por isso
      não há banner de consentimento a exibir — não há dado pessoal tratado, e a
      LGPD não é acionada.

      O que ele dá: páginas mais vistas, visitantes, origem do tráfego, país e
      Core Web Vitals. O que ele NÃO dá: funil, coorte e evento personalizado —
      o preço consciente de não rastrear pessoa.

      `defer` para não competir com o primeiro desenho. O token é público por
      construção (ele identifica o SITE, não a pessoa) e por isso pode viver aqui.
      Trocar `SEU-TOKEN` é o passo do guia; sem isso o script não faz nada — e
      falhar em silêncio é o certo para uma medição, que nunca deve derrubar a
      página que ela mede.
    -->
    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "41310f27419f4f73a7c077f2665bd682"}'></script><!-- End Cloudflare Web Analytics -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "SEU-TOKEN"}'
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
