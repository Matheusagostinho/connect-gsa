# Deploy da API — DESLIGADO no automático.
#
# Roda apenas sob demanda (aba Actions → Run workflow). Desligado a pedido em
# 19/08/2026: sem projeto no Google Cloud e sem os segredos do Workload
# Identity Federation, este workflow não tem como passar — ele falhava em
# `google-github-actions/auth` antes de qualquer coisa.
#
# Para religar, depois de criar o projeto e configurar os segredos:
#
#   on:
#     push:
#       branches: [main]
#       paths: [...]
#     workflow_dispatch:
#
# Ver docs/roadmap.md, Fatia 7.

name: Deploy da API

on:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

# Autenticação por Workload Identity Federation: o GitHub troca o próprio token
# OIDC por credenciais de curta duração do Google. Nenhuma chave de conta de
# serviço é gerada, guardada como segredo ou rotacionada — não existe chave
# para vazar (P-007).
permissions:
  contents: read
  id-token: write

env:
  REGIAO: us-east1
  SERVICO: connect-gsa-api

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Autorizar o Docker no Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGIAO }}-docker.pkg.dev --quiet

      - name: Construir e enviar a imagem
        env:
          IMAGEM: ${{ env.REGIAO }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/connect-gsa/api
        run: |
          docker build -f apps/api/Dockerfile -t "$IMAGEM:${{ github.sha }}" .
          docker push "$IMAGEM:${{ github.sha }}"

      - name: Aplicar as migrações antes de trocar a versão no ar
        # Nesta ordem de propósito: schema novo com código velho é tolerável por
        # segundos; código novo contra schema velho quebra em produção.
        run: |
          pnpm dlx prisma@7 migrate deploy --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Publicar no Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICO }}" \
            --image "${{ env.REGIAO }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/connect-gsa/api:${{ github.sha }}" \
            --region "${{ env.REGIAO }}" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 4 \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 80 \
            --set-env-vars "NODE_ENV=production,APP_VERSION=${{ github.sha }},WEB_ORIGINS=${{ vars.WEB_ORIGINS }},WEB_URL=${{ vars.WEB_URL }},API_URL=${{ vars.API_URL }}" \
            --set-secrets "DATABASE_URL=connect-gsa-database-url:latest,BETTER_AUTH_SECRET=connect-gsa-auth-secret:latest,GOOGLE_CLIENT_ID=connect-gsa-google-id:latest,GOOGLE_CLIENT_SECRET=connect-gsa-google-secret:latest,LINKEDIN_CLIENT_ID=connect-gsa-linkedin-id:latest,LINKEDIN_CLIENT_SECRET=connect-gsa-linkedin-secret:latest,GITHUB_CLIENT_ID=connect-gsa-github-id:latest,GITHUB_CLIENT_SECRET=connect-gsa-github-secret:latest"

      - name: Conferir que a versão publicada está viva
        run: |
          sleep 10
          curl --fail --silent --show-error "${{ vars.API_URL }}/health" | tee /dev/stderr | grep -q '"status":"ok"'
